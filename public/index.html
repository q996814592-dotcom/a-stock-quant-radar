<style>

</head>

<div class="tabs"><div class="tab on" onclick="tab('market',this)">市场雷达</div><div class="tab" onclick="tab('stock',this)">个股量化</div><div class="tab" onclick="tab('signals',this)">异动信号</div></div></div>
<div id="app"></div></div>
<script>
const $=s=>document.querySelector(s), fmt=(x,d=2)=>x==null?"--":Number(x).toFixed(d), api=p=>fetch(p).then(r=>r.json());
let marketData=[];
function cls(x){return x>0?'up':x<0?'down':''}
async function loadMarket(){
  const m=await api('/api/market'); if(!Array.isArray(m)) throw Error(m.error||'行情失败'); marketData=m;
  $('#status').textContent=`云端已连接 · ${m.length}只 · ${new Date().toLocaleTimeString()}`;
  renderMarket(m);
}
function renderMarket(m){
 const top=[...m].sort((a,b)=>(b.pct??-999)-(a.pct??-999)).slice(0,25);
 $('#app').innerHTML=`<div class="card"><div class="title">🔥 市场强势榜</div>${top.map(x=>`<div class="row" onclick="openStock('${x.code}')"><div><div class="name">${x.name||'--'}</div><div class="code">${x.code}</div></div><div class="pct ${cls(x.pct)}">${fmt(x.pct)}%</div><div>${fmt(x.price)}</div></div>`).join('')}</div>
 <div class="card"><div class="title">📊 市场统计</div><div class="grid">
 <div class="metric"><span class="muted">上涨</span><b class="up">${m.filter(x=>x.pct>0).length}</b></div>
 <div class="metric"><span class="muted">下跌</span><b class="down">${m.filter(x=>x.pct<0).length}</b></div>
 <div class="metric"><span class="muted">涨幅≥5%</span><b>${m.filter(x=>x.pct>=5).length}</b></div>
 <div class="metric"><span class="muted">跌幅≤-5%</span><b>${m.filter(x=>x.pct<=-5).length}</b></div></div></div>`;
}
async function openStock(code){
 const [q,k]=await Promise.all([api('/api/quote/'+code),api('/api/kline/'+code)]);
 renderStock(q,k.rows||[]);
}
